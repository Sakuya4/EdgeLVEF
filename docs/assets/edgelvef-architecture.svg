<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
<title>EdgeLVEF offline learning and compact Student inference</title>
<desc>Two-panel architecture. Offline ensemble EF and feature targets train an independent compact Student. The Student includes MobileNetV3-Large, temporal shift, residual depthwise temporal convolution, pooling and two heads. Readiness assessment is a separate module.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker></defs>

