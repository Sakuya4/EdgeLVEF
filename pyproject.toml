[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgelvef"
version = "0.1.0"
description = "PLAX-only research LVEF inference prototype"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.1",
    "torchvision>=0.16",
]

[tool.setuptools]
packages = ["edgelvef"]
