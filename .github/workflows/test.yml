name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: sha256sum -c SHA256SUMS
        working-directory: models/wall_student_v12
