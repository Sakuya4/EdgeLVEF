[Service]
Environment=EDGELVEF_SOURCE_MODE=aco_sidecar
Environment=EDGELVEF_SIDECAR_SOCKET=/run/aco-ipc/frame.sock
# env after EnvironmentFile prevents legacy probe.env overriding the source.
ExecStart=
ExecStart=/usr/bin/env EDGELVEF_SOURCE_MODE=aco_sidecar EDGELVEF_SIDECAR_SOCKET=/run/aco-ipc/frame.sock /opt/edgelvef_app/edgelvef_app/run.sh
