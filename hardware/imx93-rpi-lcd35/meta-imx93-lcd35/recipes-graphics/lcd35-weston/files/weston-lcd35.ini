[core]
use-g2d=false
repaint-window=16
gbm-format=xrgb8888
idle-time=0
xwayland=true

[shell]

[libinput]
touchscreen_calibrator=true

[screen-share]
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-clients-resize

[launcher]
icon=/opt/gopoint-apps/icon/icon_demo_launcher.png
path=QMLSCENE_DEVICE=softwarecontext /usr/bin/gopoint

[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/bin/weston-terminal

[launcher]
icon=/usr/share/weston/terminal.png
path=/opt/edgelvef_app/run.sh
